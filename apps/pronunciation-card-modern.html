<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAY IT RIGHT · 拼音发音卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F4; --surface:#FFFFFF; --surface2:#F1F1ED; --line:#E3E3DD;
  --fg:#111114; --dim:#6A6A74; --dimmer:#6A6A70;
  --acid:#2DD4BF; --acid-deep:#0F766E; --acid-ink:#06302B; --coral:#F7DCD4;
  --coral-ink:#C43A18;
  --disp:'Space Grotesk',sans-serif;
  --body:'Inter','Noto Sans SC',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:var(--acid);color:var(--acid-ink)}
:focus-visible{outline:2px solid var(--acid-deep);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 22px 120px}

/* ---------- nav ---------- */
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 72%,rgba(247,247,244,0));z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acid);border:1px solid var(--acid-deep);flex-shrink:0}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:2px}
.seg button{border:none;background:none;color:var(--dim);font-family:var(--mono);font-size:12px;padding:5px 13px;border-radius:100px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--fg);color:var(--surface);font-weight:500}

/* ---------- hero ---------- */
.hero{padding:64px 0 8px;max-width:660px}
.kicker{font-family:var(--mono);font-size:12px;color:var(--acid-deep);letter-spacing:.14em;text-transform:uppercase;margin-bottom:20px}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(38px,7.5vw,72px);line-height:.98;letter-spacing:-.035em;margin:0 0 22px}
h1 .zh{font-family:var(--body);font-weight:700;letter-spacing:-.02em}
h1 .hl{font-family:var(--body);font-weight:700;letter-spacing:-.02em;color:var(--acid-ink);background:linear-gradient(180deg,transparent 10%,var(--acid) 10%,var(--acid) 90%,transparent 90%);padding:0 .08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lede{color:var(--dim);font-size:16px;line-height:1.65;margin:0}
.lede b{color:var(--fg);font-weight:500}

/* ---------- input ---------- */
.inputzone{margin:52px 0 0;border-top:1px solid var(--line);padding-top:30px}
.inputzone label{display:block;font-family:var(--mono);font-size:11.5px;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
#in{width:100%;background:none;border:none;border-bottom:2px solid var(--line);color:var(--fg);
    font-family:var(--disp);font-weight:500;font-size:clamp(26px,5vw,42px);letter-spacing:-.02em;
    padding:6px 0 14px;transition:border-color .2s}
#in:focus{outline:none;border-bottom-color:var(--acid-deep)}
#in::placeholder{color:var(--dimmer);font-weight:500}
.meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:13px;color:var(--dimmer)}
.err{font-size:13px;color:var(--coral-ink);min-height:20px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.chips button{background:var(--surface);border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:12.5px;padding:6px 13px;border-radius:100px;cursor:pointer;transition:.15s}
.chips button:hover{border-color:var(--acid-deep);color:var(--acid-deep);background:var(--surface2)}

/* ---------- result ---------- */
#out{display:none;margin-top:56px}
.saybox{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:0 1px 2px rgba(17,17,20,.04),0 10px 30px rgba(17,17,20,.06)}
.saytop{padding:36px 34px 32px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.saytop::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(45,212,191,.30),transparent 70%);pointer-events:none}
.saylabel{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.sayline{font-family:var(--disp);font-weight:700;font-size:clamp(30px,7vw,62px);line-height:1.02;letter-spacing:-.035em;word-break:break-word}
.sayline .s{color:var(--acid-deep)}
.sayorig{margin-top:14px;font-family:var(--mono);font-size:14px;color:var(--dim)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--line)}
.cell{background:var(--surface);padding:24px 22px}
.cell-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.cell-py{font-family:var(--mono);font-size:13px;color:var(--dim)}
.cell-re{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:-.02em;color:var(--acid-deep)}
.tag{font-family:var(--mono);font-size:10px;background:var(--coral);color:var(--coral-ink);
  padding:3px 8px;border-radius:100px;letter-spacing:.05em;font-weight:500}
.note{margin-top:14px;padding-left:13px;border-left:2px solid var(--line)}
.note + .note{margin-top:11px}
.note .lbl{font-family:var(--mono);font-size:10.5px;color:var(--acid-deep);letter-spacing:.08em;margin-bottom:4px}
.note .en{font-size:13.5px;color:var(--fg);line-height:1.55}
.note .zh{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.6}
.clean{margin-top:12px;font-size:13px;color:var(--dimmer)}
.audionote{margin-top:12px;font-size:13px;color:var(--coral-ink);line-height:1.55}

/* ---------- actions ---------- */
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button.act{font-family:var(--body);font-weight:500;font-size:14.5px;padding:13px 24px;border-radius:100px;cursor:pointer;transition:.15s;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.act:hover{border-color:var(--dim);background:var(--surface2)}
button.act.key{background:var(--acid);border-color:var(--acid-deep);color:var(--acid-ink);font-weight:600}
button.act.key:hover{background:var(--acid);border-color:var(--acid-deep)}

#share{display:none;margin-top:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:24px 26px}
#share .t{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase;margin-bottom:15px}
#share pre{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:20px 22px;
  font-family:var(--body);font-size:14.5px;line-height:1.75;white-space:pre-wrap;color:var(--fg)}

footer{margin-top:70px;padding-top:22px;border-top:1px solid var(--line);color:var(--dimmer);font-size:12.5px;line-height:1.7}
@media(max-width:600px){.saytop{padding:26px 22px}.cell{padding:20px 18px}.hero{padding-top:40px}}
</style>
</head>
<body>
<div class="wrap">

<nav>
  <div class="logo"><span class="dot"></span><span>SAY IT RIGHT</span></div>
  <div class="seg" role="group" aria-label="script"><button id="b-hans" class="on" aria-pressed="true">简体</button><button id="b-hant" aria-pressed="false">繁體</button></div>
</nav>

<header class="hero">
  <div class="kicker" id="kicker"></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
</header>

<section class="inputzone">
  <label for="in" id="lb"></label>
  <input id="in" type="text" autocomplete="off" spellcheck="false">
  <div class="meta"><div class="hint" id="hint"></div><div class="err" id="err" role="alert" aria-live="assertive"></div></div>
  <div class="chips" id="chips"></div>
</section>

<section id="out" aria-live="polite" aria-atomic="true">
  <div class="saybox">
    <div class="saytop">
      <div class="saylabel" id="saylabel"></div>
      <div class="sayline" id="sayline"></div>
      <div class="sayorig" id="sayorig"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="bar">
    <button class="act key" id="b-copy"></button>
    <button class="act" id="b-share"></button>
  </div>
  <div id="share"><div class="t" id="share-t"></div><pre id="share-x"></pre></div>
</section>

<footer id="ft"></footer>
</div>

<script>
const DATA = {"t":[["ai","ai is 'eye', not 'ay'.","ai 读作 eye，不是 ay。","ai 讀作 eye，不是 ay。"],["ao","ao is 'ow' as in cow.","ao 读作 ow，如 cow。","ao 讀作 ow，如 cow。"],["ei","ei is 'ay' as in day — English ei is unreliable (either, height, vein).","ei 读作 ay；英语的 ei 拼写读音极不稳定。","ei 讀作 ay；英語的 ei 拼寫讀音極不穩定。"],["en","en rhymes with 'un', not 'en' in pen.","en 读作 un。","en 讀作 un。"],["eng","eng rhymes with 'ung', not 'eng' in length.","eng 读作 ung。","eng 讀作 ung。"],["ian","ian is 'yen', not 'ee-an'.","ian 读作 yen，这是极常见的误读。","ian 讀作 yen，這是極常見的誤讀。"],["ie","ie is 'yeh' — resist the English 'eye' in die, tie, pie.","ie 读作 yeh；英语的 die/tie/pie 会强烈诱导读成 eye 的音。","ie 讀作 yeh；英語的 die/tie/pie 會強烈誘導讀成 eye 的音。"],["in","in is 'een' — a longer vowel than English 'in'.","in 的元音比英语 in 更长更前。","in 的元音比英語 in 更長更前。"],["ing","The i is longer than the English -ing ending.","ing 的 i 比英语 -ing 词尾更长更前，但差异较小。","ing 的 i 比英語 -ing 詞尾更長更前，但差異較小。"],["o","After b/p/m/f the o carries a hidden w glide — 'waw', not 'oh'.","b p m f 后的 o 带有隐含的 w 滑音，读作 waw 而非 oh。","b p m f 後的 o 帶有隱含的 w 滑音，讀作 waw 而非 oh。"],["u","Pinyin u is always 'oo' as in moon — English u rarely reads that way.","拼音 u 恒为 oo 的音，英语的 u 很少这样读。","拼音 u 恆為 oo 的音，英語的 u 很少這樣讀。"],["c","Pinyin c is 'ts' as in cats — say the t and s together, not a k or s.","c 读作 ts（如 cats 词尾），要把 t 和 s 连读，英语母语者几乎总会读成 k 或 s。","c 讀作 ts（如 cats 詞尾），要把 t 和 s 連讀，英語母語者幾乎總會讀成 k 或 s。"],["e","This e is an 'uh' sound, like the u in run.","e 是 uh 的音，不是英语 e 的音。","e 是 uh 的音，不是英語 e 的音。"],["i","This i is a held buzz on the tongue, not 'ee'.","这里的 i 不是 ee 的音，而是舌位保持的嗡音。","這裡的 i 不是 ee 的音，而是舌位保持的嗡音。"],["ong","The oo is short, as in book — not the long oo in moon.","ong 的 oo 是 book 里的短音，不是 moon 的长音。","ong 的 oo 是 book 裡的短音，不是 moon 的長音。"],["ou","ou is a long 'oh', not 'ow'.","ou 读作 oh，不是 ow。","ou 讀作 oh，不是 ow。"],["ui","ui sounds like 'way', not 'oo-ee'.","ui 读作 way，英语母语者常拆成 oo-ee。","ui 讀作 way，英語母語者常拆成 oo-ee。"],["uo","uo is one gliding sound, 'waw' — don't split it.","uo 是一个滑音，不要拆成两个音节。","uo 是一個滑音，不要拆成兩個音節。"],["iu","iu is a single glide, 'yoh' — not 'ee-oo'.","iu 是一个滑音，读作 yoh。","iu 是一個滑音，讀作 yoh。"],["er","er is 'urr' with the tongue curled — not 'ar' as in car.","er 读作 urr，舌尖上卷，不是 car 的 ar。","er 讀作 urr，舌尖上捲，不是 car 的 ar。"],["ü","Round your lips as if saying 'oo' but say 'ee'.","ü 在英语中没有对应音，yew 是最接近的近似。","ü 在英語中沒有對應音，yew 是最接近的近似。"],["üan","üan ends in 'yen', not 'wahn'.","üan 结尾是 yen，不是 wahn。","üan 結尾是 yen，不是 wahn。"],["üe","Start with the ü lip-round, then glide to 'eh'.","üe 先摆出 ü 的口型再滑向 eh。","üe 先擺出 ü 的口型再滑向 eh。"],["ün","ün keeps the ü lip-round before the n.","ün 保持 ü 的口型再收 n。","ün 保持 ü 的口型再收 n。"],["q","Pinyin q is a 'ch' sound — never the 'kw' in queen.","英语母语者看到 q 会读成 kw，需要说明这是 ch 的音。","英語母語者看到 q 會讀成 kw，需要說明這是 ch 的音。"],["r","Between an English r and the s in measure — curl the tongue back.","r 介于英语 r 与 measure 的 s 之间，舌尖后卷。","r 介於英語 r 與 measure 的 s 之間，舌尖後捲。"],["y/w","The y and w here are spelling rules, not extra consonants.","零声母的 y/w 只是拼写规则，不是额外的辅音。","零聲母的 y/w 只是拼寫規則，不是額外的輔音。"],["x","Pinyin x is close to 'sh' — not 'ks' or 'z'.","x 是最容易读错的字母，英语里没有对应，最接近 sh。","x 是最容易讀錯的字母，英語裡沒有對應，最接近 sh。"],["z","Pinyin z is 'dz' — say the d and z together, as in kids.","z 读作 dz（如 kids 词尾），d 和 z 要连读。","z 讀作 dz（如 kids 詞尾），d 和 z 要連讀。"],["zh","zh is the 'j' in judge.","zh 读作 j，英语母语者常读成 z 的浊音。","zh 讀作 j，英語母語者常讀成 z 的濁音。"]],"r":[["a","ah",0,[]],["ai","eye",0,[0]],["an","ahn",0,[]],["ang","ahng",0,[]],["ao","ow",0,[1]],["ba","bah",0,[]],["bai","beye",0,[0]],["ban","bahn",0,[]],["bang","bahng",0,[]],["bao","baow",0,[1]],["bei","bay",0,[2]],["ben","bun",0,[3]],["beng","bung",0,[4]],["bi","bee",0,[]],["bian","byen",0,[5]],["biao","byow",0,[]],["bie","byeh",0,[6]],["bin","bean",0,[7]],["bing","bing",0,[8]],["bo","baw",0,[9]],["bu","boo",0,[10]],["ca","tsah",0,[11]],["cai","tseye",0,[11,0]],["can","tsahn",0,[11]],["cang","tsahng",0,[11]],["cao","tsow",0,[11,1]],["ce","tsuh",0,[11,12]],["cen","tsun",0,[11,3]],["ceng","tsung",0,[11,4]],["cha","chah",0,[]],["chai","cheye",0,[0]],["chan","chahn",0,[]],["chan const RE_HANZI=/[\u3400-\u9fff\uf900-\ufaff]/;
const RE_HANZI_RUN=/[\u3400-\u9fff\uf900-\ufaff]+|[^\u3400-\u9fff\uf900-\ufaff]+/g;
function normalizeToken(s){
  // Replace precomposed ü (and its toned forms) with 'v' *before* NFD, since
  // NFD decomposes ü into u + a combining diaeresis that the tone-mark strip
  // below would otherwise delete, silently turning "nü" into "nu".
  return s.toLowerCase().replace(/[üǖǘǚǜ]/g,'v')
    .normalize('NFD').replace(/[\u0300-\u0304\u030C\u0307\u0308]/g,'')
    .replace(/[^a-z'v]/g,'');
}
function segment(c){
  if(!c) return [];
  const m={};
  function go(i){ if(i===c.length) return [];
    if(i in m) return m[i];
    for(const k of KEYS){ if(c.startsWith(k,i)){ const r=go(i+k.length); if(r!==null){ m[i]=[k,...r]; return m[i]; } } }
    m[i]=null; return null; }
  return go(0);
}
// Tokens are split on the *raw* input first so Hanzi characters (unsupported —
// this tool reads pinyin, not Chinese script) can be reported explicitly
// instead of being silently stripped out by normalize() and producing a
// success-shaped empty result. Mixed input (pinyin + Hanzi in the same string)
// still parses whatever pinyin is present while flagging the Hanzi part.
function parse(raw){
  const tokens=raw.split(/[\s\-']+/).filter(Boolean), out=[], bad=[], hanzi=[];
  function addLatin(str){
    const c=normalizeToken(str);
    if(!c){ bad.push(str); return; }
    const s=segment(c);
    if(s===null) bad.push(str); else out.push(...s);
  }
  for(const rt of tokens){
    if(!RE_HANZI.test(rt)){ addLatin(rt); continue; }
    // Token mixes Hanzi with Latin pinyin without a separator (e.g.
    // "许Xiaoqing") -- split into alternating Hanzi/non-Hanzi runs so the
    // Hanzi is still reported while any adjoining pinyin is still parsed,
    // instead of dropping the whole token into `hanzi`.
    for(const run of rt.match(RE_HANZI_RUN)||[]){
      if(RE_HANZI.test(run)) hanzi.push(run); else addLatin(run);
    }
  }
  return {syls:out,bad,hanzi};
}

function run(){
  const raw=$('in').value.trim(), s=t();
  if(!raw){ $('out').style.display='none'; $('err').textContent=''; last=null; $('share-x').textContent=''; return; }
  const {syls,bad,hanzi}=parse(raw);
  const msgs=[];
  if(hanzi.length) msgs.push(s.err_hanzi+hanzi.join(', '));
  if(bad.length) msgs.push(s.err_bad+bad.join(', ')+' · '+s.err_hint);
  $('err').textContent = msgs.join(' · ');
  if(!syls.length){ $('out').style.display='none'; last=null; $('share-x').textContent=''; return; }
  const rows=syls.map(k=>BY[k]).filter(Boolean);
  last={raw,rows};

  $('sayline').innerHTML=rows.map(r=>r.re.toUpperCase()).join('<span class="s">·</span>');
  $('sayorig').textContent=raw;

  const g=$('grid'); g.innerHTML='';
  for(const r of rows){
    const d=document.createElement('div'); d.className='cell';
    let h='<div class="cell-hd"><span class="cell-py">'+r.syl+'</span><span class="cell-re">'+r.re+'</span>'
      +(r.audio?'<span class="tag">'+s.audio+'</span>':'')+'</div>';
    if(r.traps.length){
      for(const tr of r.traps)
        h+='<div class="note"><div class="lbl">'+tr.label+'</div><div class="en">'+tr.en+'</div>'
          +'<div class="zh">'+(variant==='hant'?tr.hant:tr.hans)+'</div></div>';
    } else h+='<div class="clean">'+s.clean+'</div>';
    if(r.audio) h+='<div class="audionote">'+s.audionote+'</div>';
    d.innerHTML=h; g.appendChild(d);
  }
  if($('share').style.display==='block') $('share-x').textContent=shareText();
  $('out').style.display='block';
}

function shareText(){
  if(!last) return '';
  const {raw,rows}=last, L=[];
  L.push('My name is '+raw+'. It sounds like '+rows.map(r=>r.re.toUpperCase()).join('-')+'.');
  L.push('');
  L.push(rows.map(r=>r.syl+' = '+r.re).join('   \u00b7   '));
  L.push('');
  const seen=new Set(), notes=[];
  for(const r of rows) for(const tr of r.traps){
    if(seen.has(tr.label)) continue; seen.add(tr.label);
    notes.push(CASUAL[tr.label]||tr.en);
  }
  if(notes.length){
    L.push('The parts that trip people up:');
    notes.slice(0,3).forEach(n=>L.push('  \u2022 '+n));
    L.push('');
  }
  const na=rows.some(r=>r.audio);
  L.push(na?'One of those sounds genuinely has no English spelling \u2014 honestly, just ask me to say it once and you\u2019ll have it.'
    :(notes.length?'If it helps: pinyin was built for Chinese readers, not English ones. It\u2019s actively misleading you. Getting it wrong doesn\u2019t mean you weren\u2019t paying attention.'
      :'This one\u2019s easier than most \u2014 it reads pretty much how it looks.'));
  L.push('');
  L.push('And thanks for bothering to ask. It genuinely means a lot.');
  return L.join('\n');
}

function legacyCopy(x){
  const ta=document.createElement('textarea');
  ta.value=x; ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,x.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  document.body.removeChild(ta); return ok;
}
function flash(){ const b=$('b-copy'); b.textContent=t().copied; setTimeout(()=>{b.textContent=t().copy;},1300); }
function manual(){
  const sh=$('share'); sh.style.display='block';
  $('share-x').textContent=shareText(); $('b-share').textContent=t().hide;
  const rg=document.createRange(); rg.selectNodeContents($('share-x'));
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
  $('share-x').scrollIntoView({behavior:'smooth',block:'center'});
  $('b-copy').textContent=t().copy_manual;
  setTimeout(()=>{$('b-copy').textContent=t().copy;},2600);
}

$('b-hans').onclick=()=>{variant='hans';$('b-hans').classList.add('on');$('b-hant').classList.remove('on');renderStatic();run();if($('share').style.display==='block')$('share-x').textContent=shareText();};
$('b-hant').onclick=()=>{variant='hant';$('b-hant').classList.add('on');$('b-hans').classList.remove('on');renderStatic();run();if($('share').style.display==='block')$('share-x').textContent=shareText();};
$('in').addEventListener('input',run);
$('b-share').onclick=()=>{
  const sh=$('share'), open=sh.style.display==='block';
  sh.style.display=open?'none':'block';
  if(!open) $('share-x').textContent=shareText();
  $('b-share').textContent=open?t().share:t().hide;
};
$('b-copy').onclick=()=>{
  const x=shareText(); if(!x) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(x).then(flash).catch(()=>{ legacyCopy(x)?flash():manual(); });
  } else { legacyCopy(x)?flash():manual(); }
};

renderStatic();
</script>
