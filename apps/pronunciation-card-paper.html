<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>念对我的名字 · 拼音发音卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEAE0; --raised:#F5F3EB; --ink:#201D18; --soft:#55503f;
  --muted:#68635A; --border:#D8D2C2; --cinnabar:#A63A26; --cinnabar-d:#8f3020;
  --azurite:#3D5A73; --ochre:#A97C3F;
  --zh:'Noto Serif SC',serif; --en:'Roboto Slab',serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--zh);line-height:1.7;-webkit-font-smoothing:antialiased}
::selection{background:var(--cinnabar);color:var(--paper)}
:focus-visible{outline:2px solid var(--azurite);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 24px 100px}

header{display:flex;align-items:center;justify-content:space-between;padding:26px 0 18px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.mark{width:30px;height:30px;background:var(--cinnabar);color:var(--paper);display:flex;align-items:center;justify-content:center;border-radius:3px;transform:rotate(-3deg);font-size:15px;flex-shrink:0}
.toggle{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;font-family:var(--mono);font-size:13px}
.toggle button{padding:7px 14px;background:none;border:none;color:var(--soft);cursor:pointer;font-family:inherit}
.toggle button.on{background:var(--ink);color:var(--paper)}

.hero{padding:48px 0 32px}
.hero h1{font-size:clamp(26px,4vw,38px);margin:0 0 12px;line-height:1.35;font-weight:700}
.hero h1 .ac{color:var(--cinnabar)}
.hero p{color:var(--soft);max-width:540px;margin:0;font-size:15.5px}

.panel{background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:28px;margin-bottom:36px}
label{display:block;font-family:var(--mono);font-size:12.5px;color:var(--soft);margin-bottom:8px;letter-spacing:.02em}
input[type=text]{width:100%;font-family:var(--en);font-size:19px;padding:12px 14px;border:1px solid var(--border);border-radius:4px;background:var(--paper);color:var(--ink)}
input::placeholder{color:var(--muted);font-family:var(--zh);font-size:16px}
.hint{font-size:12.5px;color:var(--muted);margin-top:7px;font-family:var(--zh)}
.err{color:var(--cinnabar);font-size:13px;margin-top:9px;min-height:19px}
.examples{margin-top:14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.examples span{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.examples button{background:none;border:1px dashed var(--border);border-radius:999px;padding:4px 11px;font-family:var(--en);font-size:13px;color:var(--soft);cursor:pointer}
.examples button:hover{border-color:var(--cinnabar);color:var(--cinnabar);border-style:solid}

/* ---- card ---- */
#out{display:none}
.card{background:var(--raised);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:22px}
.card-hd{background:var(--ink);color:var(--paper);padding:26px 28px}
.card-hd .lbl{font-family:var(--mono);font-size:11.5px;color:#b8b2a2;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px}
.card-hd .say{font-family:var(--en);font-size:clamp(27px,5.5vw,42px);font-weight:700;line-height:1.15;word-break:break-word}
.card-hd .say .sep{color:var(--cinnabar);margin:0 2px}
.card-hd .orig{margin-top:9px;font-size:15px;color:#c9c4b3}

.syls{padding:6px 28px 22px}
.syl{padding:17px 0;border-bottom:1px dashed var(--border)}
.syl:last-child{border-bottom:none}
.syl-top{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
.syl-py{font-family:var(--mono);font-size:16px;color:var(--soft);min-width:62px}
.syl-arrow{color:var(--muted)}
.syl-re{font-family:var(--en);font-size:23px;font-weight:700}
.audio-tag{font-family:var(--mono);font-size:11px;background:var(--ochre);color:var(--paper);padding:2px 8px;border-radius:3px;letter-spacing:.03em}
.trap{margin-top:11px;background:#f3ece0;border-left:3px solid var(--ochre);padding:10px 13px;border-radius:0 3px 3px 0}
.trap .tag{font-family:var(--mono);font-size:11px;color:var(--ochre);font-weight:500;letter-spacing:.04em;margin-bottom:3px}
.trap .en{font-size:14px;color:#6b4e26;font-family:var(--en);line-height:1.5}
.trap .zh{font-size:13.5px;color:var(--soft);margin-top:3px}
.no-trap{margin-top:8px;font-size:13px;color:var(--muted)}

.actions{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:14px}
.btn{padding:12px 20px;border-radius:4px;font-family:var(--zh);font-size:14.5px;cursor:pointer;border:1px solid var(--border);background:var(--raised);color:var(--soft)}
.btn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.btn.primary{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--paper)}
.btn.primary:hover{background:var(--cinnabar-d);color:var(--paper)}

.share{background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:20px 22px;margin-bottom:22px;display:none}
.share .t{font-family:var(--mono);font-size:12px;color:var(--soft);margin-bottom:11px}
.share pre{margin:0;font-family:var(--en);font-size:14px;line-height:1.75;white-space:pre-wrap;color:var(--ink);background:var(--paper);padding:15px 17px;border-radius:4px;border:1px solid var(--border)}

footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px}
footer a{color:var(--azurite)}
@media(max-width:560px){.panel{padding:20px}.card-hd,.syls{padding-left:19px;padding-right:19px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand"><div class="mark">音</div><span id="brand-name"></span></div>
  <div class="toggle" role="group" aria-label="script"><button id="b-hans" class="on" aria-pressed="true">简体</button><button id="b-hant" aria-pressed="false">繁體</button></div>
</header>

<section class="hero">
  <h1 id="h1"></h1>
  <p id="sub"></p>
</section>

<section class="panel">
  <label id="lb" for="in"></label>
  <input type="text" id="in" autocomplete="off" spellcheck="false" autofocus aria-describedby="hint err">
  <div class="hint" id="hint"></div>
  <div class="err" id="err" role="alert" aria-live="assertive"></div>
  <div class="examples" id="ex"></div>
</section>

<section id="out" aria-live="polite" aria-atomic="true">
  <div class="card">
    <div class="card-hd">
      <div class="lbl" id="cl"></div>
      <div class="say" id="say"></div>
      <div class="orig" id="orig"></div>
    </div>
    <div class="syls" id="syls"></div>
  </div>
  <div class="actions">
    <button class="btn primary" id="b-share"></button>
    <button class="btn" id="b-copy"></button>
  </div>
  <div class="share" id="share">
    <div class="t" id="share-t"></div>
    <pre id="share-x"></pre>
  </div>
</section>

<footer id="ft"></footer>
</div>

<script>
const DATA = {"t":[["ai","ai is 'eye', not 'ay'.","ai 读作 eye，不是 ay。","ai 讀作 eye，不是 ay。"],["ao","ao is 'ow' as in cow.","ao 读作 ow，如 cow。","ao 讀作 ow，如 cow。"],["ei","ei is 'ay' as in day — English ei is unreliable (either, height, vein).","ei 读作 ay；英语的 ei 拼写读音极不稳定。","ei 讀作 ay；英語的 ei 拼寫讀音極不穩定。"],["en","en rhymes with 'un', not 'en' in pen.","en 读作 un。","en 讀作 un。"],["eng","eng rhymes with 'ung', not 'eng' in length.","eng 读作 ung。","eng 讀作 ung。"],["ian","ian is 'yen', not 'ee-an'.","ian 读作 yen，这是极常见的误读。","ian 讀作 yen，這是極常見的誤讀。"],["ie","ie is 'yeh' — resist the English 'eye' in die, tie, pie.","ie 读作 yeh；英语的 die/tie/pie 会强烈诱导读成 eye 的音。","ie 讀作 yeh；英語的 die/tie/pie 會強烈誘導讀成 eye 的音。"],["in","in is 'een' — a longer vowel than English 'in'.","in 的元音比英语 in 更长更前。","in 的元音比英語 in 更長更前。"],["ing","The i is longer than the English -ing ending.","ing 的 i 比英语 -ing 词尾更长更前，但差异较小。","ing 的 i 比英語 -ing 詞尾更長更前，但差異較小。"],["o","After b/p/m/f the o carries a hidden w glide — 'waw', not 'oh'.","b p m f 后的 o 带有隐含的 w 滑音，读作 waw 而非 oh。","b p m f 後的 o 帶有隱含的 w 滑音，讀作 waw 而非 oh。"],["u","Pinyin u is always 'oo' as in moon — English u rarely reads that way.","拼音 u 恒为 oo 的音，英语的 u 很少这样读。","拼音 u 恆為 oo 的音，英語的 u 很少這樣讀。"],["c","Pinyin c is 'ts' as in cats — say the t and s together, not a k or s.","c 读作 ts（如 cats 词尾），要把 t 和 s 连读，英语母语者几乎总会读成 k 或 s。","c 讀作 ts（如 cats 詞尾），要把 t 和 s 連讀，英語母語者幾乎總會讀成 k 或 s。"],["e","This e is an 'uh' sound, like the u in run.","e 是 uh 的音，不是英语 e 的音。","e 是 uh 的音，不是英語 e 的音。"],["i","This i is a held buzz on the tongue, not 'ee'.","这里的 i 不是 ee 的音，而是舌位保持的嗡音。","這裡的 i 不是 ee 的音，而是舌位保持的嗡音。"],["ong","The oo is short, as in book — not the long oo in moon.","ong 的 oo 是 book 里的短音，不是 moon 的长音。","ong 的 oo 是 book 裡的短音，不是 moon 的長音。"],["ou","ou is a long 'oh', not 'ow'.","ou 读作 oh，不是 ow。","ou 讀作 oh，不是 ow。"],["ui","ui sounds like 'way', not 'oo-ee'.","ui 读作 way，英语母语者常拆成 oo-ee。","ui 讀作 way，英語母語者常拆成 oo-ee。"],["uo","uo is one gliding sound, 'waw' — don't split it.","uo 是一个滑音，不要拆成两个音节。","uo 是一個滑音，不要拆成兩個音節。"],["iu","iu is a single glide, 'yoh' — not 'ee-oo'.","iu 是一个滑音，读作 yoh。","iu 是一個滑音，讀作 yoh。"],["er","er is 'urr' with the tongue curled — not 'ar' as in car.","er 读作 urr，舌尖上卷，不是 car 的 ar。","er 讀作 urr，舌尖上捲，不是 car 的 ar。"],["ü","Round your lips as if saying 'oo' but say 'ee'.","ü 在英语中没有对应音，yew 是最接近的近似。","ü 在英語中沒有對應音，yew 是最接近的近似。"],["üan","üan ends in 'yen', not 'wahn'.","üan 结尾是 yen，不是 wahn。","üan 結尾是 yen，不是 wahn。"],["üe","Start with the ü lip-round, then glide to 'eh'.","üe 先摆出 ü 的口型再滑向 eh。","üe 先擺出 ü 的口型再滑向 eh。"],["ün","ün keeps the ü lip-round before the n.","ün 保持 ü 的口型再收 n。","ün 保持 ü 的口型再收 n。"],["q","Pinyin q is a 'ch' sound — never the 'kw' in queen.","英语母语者看到 q 会读成 kw，需要说明这是 ch 的音。","英語母語者看到 q 會讀成 kw，需要說明這是 ch 的音。"],["r","Between an English r and the s in measure — curl the tongue back.","r 介于英语 r 与 measure 的 s 之间，舌尖后卷。","r 介於英語 r 與 measure 的 s 之間，舌尖後捲。"],["y/w","The y and w here are spelling rules, not extra consonants.","零声母的 y/w 只是拼写规则，不是额外的辅音。","零聲母的 y/w 只是拼寫規則，不是額外的輔音。"],["x","Pinyin x is close to 'sh' — not 'ks' or 'z'.","x 是最容易读错的字母，英语里没有对应，最接近 sh。","x 是最容易讀錯的字母，英語裡沒有對應，最接近 sh。"],["z","Pinyin z is 'dz' — say the d and z together, as in kids.","z 读作 dz（如 kids 词尾），d 和 z 要连读。","z 讀作 dz（如 kids 詞尾），d 和 z 要連讀。"],["zh","zh is the 'j' in judge.","zh 读作 j，英语母语者常读成 z 的浊音。","zh 讀作 j，英語母語者常讀成 z 的濁音。"]],"r":[["a","ah",0,[]],["ai","eye",0,[0]],["an","ahn",0,[]],["ang","ahng",0,[]],["ao","ow",0,[1]],["ba","bah",0,[]],["bai","beye",0,[0]],["ban","bahn",0,[]],["bang","bahng",0,[]],["bao","baow",0,[1]],["bei","bay",0,[2]],["ben","bun",0,[3]],["beng","bung",0,[4]],["bi","bee",0,[]],["bian","byen",0,[5]],["biao","byow",0,[]],["bie","byeh",0,[6]],["bin","bean",0,[7]],["bing","bing",0,[8]],["bo","baw",0,[9]],["bu","boo",0,[10]],["ca","tsah",0,[11]],["cai","tseye",0,[11,0]],["can","tsahn",0,[11]],["cang","tsahng",0,[11]],["cao","tsow",0,[11,1]],["ce","tsuh",0,[11,12]],["cen","tsun",0,[11,3]],["ceng","tsung",0,[11,4]],["cha","chah",0,[]],["chai","cheye",0,[0]],["chan","chahn",0,[]],["chan const RE_HANZI = /[\u3400-\u9fff\uf900-\ufaff]/;
const RE_HANZI_RUN = /[\u3400-\u9fff\uf900-\ufaff]+|[^\u3400-\u9fff\uf900-\ufaff]+/g;
function normalizeToken(s){
  // Replace precomposed ü (and its toned forms) with 'v' *before* NFD, since
  // NFD decomposes ü into u + a combining diaeresis that the tone-mark strip
  // below would otherwise delete, silently turning "nü" into "nu".
  return s.toLowerCase().replace(/[üǖǘǚǜ]/g,'v')
    .normalize('NFD').replace(/[\u0300-\u0304\u030C\u0307\u0308]/g,'')
    .replace(/[^a-z'v]/g,'');
}

// Longest-match segmentation with backtracking. "xian" is a real syllable, so
// greedy alone would mis-split "xi'an"; backtracking recovers.
function segment(chunk){
  if(!chunk) return [];
  const memo={};
  function go(i){
    if(i===chunk.length) return [];
    if(i in memo) return memo[i];
    for(const k of KEYS){
      if(chunk.startsWith(k,i)){
        const rest=go(i+k.length);
        if(rest!==null){ memo[i]=[k,...rest]; return memo[i]; }
      }
    }
    memo[i]=null; return null;
  }
  return go(0);
}

// Tokens are split on the *raw* input first so Hanzi characters (unsupported —
// this tool reads pinyin, not Chinese script) can be reported explicitly
// instead of being silently stripped out by normalization and producing a
// success-shaped empty result. Mixed input (pinyin + Hanzi in the same
// string) still parses whatever pinyin is present while flagging the Hanzi.
function parse(raw){
  const tokens=raw.split(/[\s\-']+/).filter(Boolean);
  const out=[], bad=[], hanzi=[];
  function addLatin(str){
    const c=normalizeToken(str);
    if(!c){ bad.push(str); return; }
    const seg=segment(c);
    if(seg===null) bad.push(str); else out.push(...seg);
  }
  for(const rt of tokens){
    if(!RE_HANZI.test(rt)){ addLatin(rt); continue; }
    // Token mixes Hanzi with Latin pinyin without a separator (e.g.
    // "许Xiaoqing") -- split into alternating Hanzi/non-Hanzi runs so the
    // Hanzi is still reported while any adjoining pinyin is still parsed,
    // instead of dropping the whole token into `hanzi`.
    for(const run of rt.match(RE_HANZI_RUN)||[]){
      if(RE_HANZI.test(run)) hanzi.push(run); else addLatin(run);
    }
  }
  return {syls:out, bad, hanzi};
}

  $('ft').textContent=s.ft;

}

function run(){
  const raw=$('in').value.trim();
  const s=t();
  if(!raw){ $('out').style.display='none'; $('err').textContent=''; lastResult=null; $('share-x').textContent=''; return; }
  const {syls,bad,hanzi}=parse(raw);
  const msgs=[];
  if(hanzi.length) msgs.push(s.err_hanzi+hanzi.join(', '));
  if(bad.length) msgs.push(s.err_bad+' '+bad.join(', ')+'。'+s.err_hint);
  $('err').textContent = msgs.join(' ');
  if(!syls.length){ $('out').style.display='none'; lastResult=null; $('share-x').textContent=''; return; }

  const rows=syls.map(k=>BY[k]).filter(Boolean);
  lastResult={raw,rows};

  $('say').innerHTML=rows.map(r=>r.re.toUpperCase()).join('<span class="sep">-</span>');
  $('orig').textContent=raw;

  const box=$('syls'); box.innerHTML='';
  for(const r of rows){
    const d=document.createElement('div'); d.className='syl';
    let h='<div class="syl-top"><span class="syl-py">'+r.syl+'</span>'
        +'<span class="syl-arrow">→</span><span class="syl-re">'+r.re+'</span>'
        +(r.audio?'<span class="audio-tag">'+s.audio+'</span>':'')+'</div>';
    if(r.traps.length){
      for(const tr of r.traps){
        h+='<div class="trap"><div class="tag">'+tr.label+'</div>'
          +'<div class="en">'+tr.en+'</div>'
          +'<div class="zh">'+(variant==='hant'?tr.hant:tr.hans)+'</div></div>';
      }
    } else {
      h+='<div class="no-trap">'+s.notrap+'</div>';
    }
    if(r.audio) h+='<div class="no-trap">'+s.audio_note+'</div>';
    d.innerHTML=h; box.appendChild(d);
  }
  if($('share').style.display==='block') $('share-x').textContent=shareText();
  $('out').style.display='block';
}

  'iu':"\u201ciu\u201d is one sound, \u201cyoh\u201d \u2014 don\u2019t split it in two",
  'e':"that E is an \u201cuh\u201d, like the u in \u201crun\u201d",
  'en':"\u201cen\u201d rhymes with \u201cun\u201d, not \u201cpen\u201d",
  'eng':"\u201ceng\u201d rhymes with \u201cung\u201d, not \u201clength\u201d",
  'ao':"\u201cao\u201d is \u201cow\u201d, like \u201ccow\u201d",
  'ai':"\u201cai\u201d is just \u201ceye\u201d",
  'ou':"\u201cou\u201d is a long \u201coh\u201d, not \u201cow\u201d",
  'uo':"\u201cuo\u201d glides into one sound, \u201cwaw\u201d",
  'ong':"the \u201coo\u201d is short, like \u201cbook\u201d \u2014 not \u201cmoon\u201d",
  'er':"\u201cer\u201d is \u201curr\u201d with your tongue curled, not \u201ccar\u201d",
  '\u00fc':"round your lips like you\u2019re saying \u201coo\u201d, then say \u201cee\u201d. That\u2019s the whole trick",
  '\u00fce':"start with that \u00fc lip-round, then slide into \u201ceh\u201d",
  '\u00fcan':"it ends in \u201cyen\u201d, not \u201cwahn\u201d",
  '\u00fcn':"keep the \u00fc lip-round right up to the n",
  'o':"there\u2019s a hidden \u201cw\u201d in there \u2014 it\u2019s \u201cwaw\u201d, not \u201coh\u201d",
  'u':"the U is always \u201coo\u201d, like \u201cmoon\u201d",
  'in':"\u201cin\u201d is a longer \u201ceen\u201d than you\u2019d guess",
  'ing':"the i runs a touch longer than an English \u201c-ing\u201d",
  'ei':"\u201cei\u201d is \u201cay\u201d, like \u201cday\u201d",
  'i':"that i isn\u2019t \u201cee\u201d \u2014 it\u2019s more of a buzz you hold on your tongue",
  'y/w':"the y and w are just spelling rules, not extra sounds"
};

function shareText(){
  if(!lastResult) return '';
  const {raw,rows}=lastResult;
  const say = rows.map(r=>r.re.toUpperCase()).join('-');
  const L=[];

  L.push('My name is '+raw+'. It sounds like '+say+'.');
  L.push('');

  // Syllable-by-syllable, spoken rather than tabulated.
  L.push(rows.map(r=>r.syl+' = '+r.re).join('   \u00b7   '));
  L.push('');

  // Gather the notes worth mentioning, most misleading first, deduped.
  const seen=new Set(); const notes=[];
  for(const r of rows) for(const tr of r.traps){
    if(seen.has(tr.label)) continue;
    seen.add(tr.label);
    notes.push(CASUAL[tr.label] || tr.en);
  }

  if(notes.length){
    const top = notes.slice(0,3);
    L.push('The parts that trip people up:');
    for(const n of top) L.push('  \u2022 '+n);
    L.push('');
  }

  const needsAudio = rows.some(r=>r.audio);
  if(needsAudio){
    L.push('One of those sounds genuinely has no English spelling \u2014 honestly, just ask me to say it once and you\u2019ll have it.');
  } else if(notes.length){
    L.push('If it helps: pinyin was built for Chinese readers, not English ones. It\u2019s actively misleading you. Getting it wrong doesn\u2019t mean you weren\u2019t paying attention.');
  } else {
    L.push('This one\u2019s easier than most \u2014 it reads pretty much how it looks.');
  }
  L.push('');
  L.push('And thanks for bothering to ask. It genuinely means a lot.');

  return L.join('\n');
}

$('b-hans').onclick=()=>{variant='hans';$('b-hans').classList.add('on');$('b-hant').classList.remove('on');renderStatic();run();if($('share').style.display==='block')$('share-x').textContent=shareText();};
$('b-hant').onclick=()=>{variant='hant';$('b-hant').classList.add('on');$('b-hans').classList.remove('on');renderStatic();run();if($('share').style.display==='block')$('share-x').textContent=shareText();};
$('in').addEventListener('input',run);
$('b-share').onclick=()=>{
  const sh=$('share'); const open=sh.style.display==='block';
  sh.style.display=open?'none':'block';
  if(!open) $('share-x').textContent=shareText();
  $('b-share').textContent=open?t().share:t().hide;
};
// navigator.clipboard needs a secure context, which a file:// page is not.
// Try it, fall back to execCommand, and if both fail reveal the panel and
// select the text so the user can copy manually.
function legacyCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0,text.length);
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  return ok;
}
function flashCopied(){
  const b=$('b-copy'); b.textContent=t().copied;
  setTimeout(()=>{b.textContent=t().copy;},1300);
}
function revealForManualCopy(){
  const sh=$('share');
  sh.style.display='block';
  $('share-x').textContent=shareText();
  $('b-share').textContent=t().hide;
  const rng=document.createRange();
  rng.selectNodeContents($('share-x'));
  const sel=window.getSelection();
  sel.removeAllRanges(); sel.addRange(rng);
  $('share-x').scrollIntoView({behavior:'smooth',block:'center'});
  $('b-copy').textContent=t().copy_manual;
  setTimeout(()=>{$('b-copy').textContent=t().copy;},2600);
}
$('b-copy').onclick=()=>{
  const text=shareText();
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(flashCopied).catch(()=>{
      if(legacyCopy(text)) flashCopied(); else revealForManualCopy();
    });
  } else {
    if(legacyCopy(text)) flashCopied(); else revealForManualCopy();
  }
};

renderStatic();
